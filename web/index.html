<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1ea">
  <title>Minutes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Minutes</h1>
    <div id="userbox" class="userbox" hidden>
      <span id="useremail"></span>
      <button id="logout" class="link">ログアウト</button>
    </div>
  </header>

  <main>
    <!-- ログイン -->
    <section id="auth" class="card" hidden>
      <div class="tabs" role="tablist">
        <button id="tab-login" class="tab active" role="tab">ログイン</button>
        <button id="tab-signup" class="tab" role="tab">新規登録</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <label>メールアドレス
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>パスワード（8文字以上）
          <input id="password" type="password" autocomplete="current-password" minlength="8" required>
        </label>
        <button id="auth-submit" class="primary" type="submit">ログイン</button>
        <p id="auth-msg" class="msg" role="status"></p>
      </form>
    </section>

    <!-- アプリ本体 -->
    <div id="app" hidden>
      <section class="card">
        <h2>音声を文字にする</h2>
        <div class="actions">
          <button id="rec" class="primary big">● 録音する</button>
          <label class="file">
            <input id="file" type="file" accept="audio/*,video/mp4,.m4a,.mp3,.wav,.webm,.ogg,.aac,.flac,.caf">
            <span>ファイルを選ぶ</span>
          </label>
        </div>
        <p id="status" class="msg" role="status"></p>
      </section>

      <section id="editor" class="card" hidden>
        <h2>文字起こし結果</h2>
        <label>タイトル
          <input id="title" type="text" maxlength="100" placeholder="例：2026/10/19 通院メモ">
        </label>
        <label>日付
          <input id="recorded-on" type="date">
        </label>
        <label>本文
          <textarea id="text" rows="10"></textarea>
        </label>
        <label>メモ
          <textarea id="memo" rows="3" placeholder="先生に聞きたいこと、体調など"></textarea>
        </label>
        <div class="actions">
          <button id="save" class="primary">保存</button>
          <button id="copy">コピー</button>
          <button id="discard" class="link">破棄</button>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <h2>履歴</h2>
          <input id="search" type="search" placeholder="検索">
        </div>
        <ul id="list" class="list"></ul>
        <p id="empty" class="msg" hidden>まだ保存されたものはありません。</p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script src="app.js"></script>
</body>
</html>
