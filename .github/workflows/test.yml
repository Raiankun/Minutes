name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # テストは Whisper を差し替えて動かすため、faster-whisper は入れなくてよい
      - run: pip install fastapi "uvicorn[standard]" python-multipart httpx pytest
      - run: python -m pytest -q server/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/web/*.test.js
